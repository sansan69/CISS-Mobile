<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Flutter substitutes this value from --base-href. The web build is published
    under https://cisskerala.site/app/, so the deployment must build with
    --base-href=/app/.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="CISS Workforce web app for guards and field officers: attendance, patrols, incidents, and field reports.">
  <meta name="theme-color" content="#014c85">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CISS Workforce">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CISS Workforce</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown until the Flutter engine paints its first frame. */
    html, body { margin: 0; height: 100%; background: #05070d; }
    #ciss-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
    }
    #ciss-loader img { width: 64px; height: 64px; }
    #ciss-loader .bar {
      width: 160px;
      height: 3px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.2);
      overflow: hidden;
    }
    #ciss-loader .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: #5c9dd6;
      animation: ciss-slide 1.1s ease-in-out infinite;
    }
    @keyframes ciss-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
  </style>
</head>
<body>
  <div id="ciss-loader">
    <img src="icons/Icon-192.png" alt="CISS Workforce">
    <div class="bar"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove the splash once the first Flutter frame is on screen.
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('ciss-loader');
      if (loader) loader.remove();
    });
  </script>
</body>
</html>
